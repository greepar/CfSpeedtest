name: CfSpeedtest NativeAOT Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  WEB_PATH: "src/CfSpeedtest.Web"

jobs:
  build-web:
    name: Build WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_PATH }}/package-lock.json

      - name: Build WebUI
        run: |
          npm ci
          npm run build
        working-directory: ${{ env.WEB_PATH }}

      - name: Upload WebUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfspeedtest-webui
          path: src/CfSpeedtest.Server/wwwroot
          if-no-files-found: error

  build-native:
    name: Build ${{ matrix.kind }} (${{ matrix.rid }})
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: win-x64
            archive_name: cfspeedtest-client-win-x64
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: win-arm64
            archive_name: cfspeedtest-client-win-arm64
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: linux-x64
            archive_name: cfspeedtest-client-linux-x64
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: linux-arm64
            archive_name: cfspeedtest-client-linux-arm64
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: linux-arm
            archive_name: cfspeedtest-client-linux-arm
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: linux-musl-x64
            archive_name: cfspeedtest-client-linux-musl-x64
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: linux-musl-arm64
            archive_name: cfspeedtest-client-linux-musl-arm64
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: osx-x64
            archive_name: cfspeedtest-client-osx-x64
          - kind: Client
            project: src/CfSpeedtest.Client/CfSpeedtest.Client.csproj
            rid: osx-arm64
            archive_name: cfspeedtest-client-osx-arm64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: win-x64
            archive_name: cfspeedtest-server-win-x64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: win-arm64
            archive_name: cfspeedtest-server-win-arm64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: linux-x64
            archive_name: cfspeedtest-server-linux-x64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: linux-arm64
            archive_name: cfspeedtest-server-linux-arm64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: linux-musl-x64
            archive_name: cfspeedtest-server-linux-musl-x64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: linux-musl-arm64
            archive_name: cfspeedtest-server-linux-musl-arm64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: osx-x64
            archive_name: cfspeedtest-server-osx-x64
          - kind: Server
            project: src/CfSpeedtest.Server/CfSpeedtest.Server.csproj
            rid: osx-arm64
            archive_name: cfspeedtest-server-osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WebUI artifact
        uses: actions/download-artifact@v4
        with:
          name: cfspeedtest-webui
          path: src/CfSpeedtest.Server/wwwroot

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish NativeAOT with AotAnywhere
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.kind }}-${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:StripSymbols=true
          -p:SkipBuildWebUi=true

      - name: Verify embedded WebUI
        if: matrix.kind == 'Server'
        run: |
          binary="publish/${{ matrix.kind }}-${{ matrix.rid }}/CfSpeedtest.Server"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            binary="${binary}.exe"
          fi
          strings "$binary" | grep -F "wwwroot/index.html"

      - name: Remove debug symbols
        run: |
          find "publish/${{ matrix.kind }}-${{ matrix.rid }}" -type f -name "*.pdb" -delete || true
          find "publish/${{ matrix.kind }}-${{ matrix.rid }}" -type f -name "*.dbg" -delete || true
          find "publish/${{ matrix.kind }}-${{ matrix.rid }}" -type d -name "*.dSYM" -exec rm -rf {} + || true

      - name: Create archive
        run: |
          cd "publish/${{ matrix.kind }}-${{ matrix.rid }}"
          zip -r "../../${{ matrix.archive_name }}.zip" .

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.zip
          if-no-files-found: error

  publish-containers:
    name: Publish NativeAOT container (${{ matrix.component }})
    if: github.ref_type == 'tag'
    needs: build-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            image: cfspeedtest-server
            dockerfile: docker/server.Dockerfile
          - component: client
            image: cfspeedtest-client
            dockerfile: docker/client.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x64 NativeAOT artifact
        uses: actions/download-artifact@v4
        with:
          name: cfspeedtest-${{ matrix.component }}-linux-musl-x64
          path: artifacts

      - name: Download ARM64 NativeAOT artifact
        uses: actions/download-artifact@v4
        with:
          name: cfspeedtest-${{ matrix.component }}-linux-musl-arm64
          path: artifacts

      - name: Prepare container build context
        run: |
          mkdir -p "container/${{ matrix.component }}-amd64" "container/${{ matrix.component }}-arm64"
          unzip "artifacts/cfspeedtest-${{ matrix.component }}-linux-musl-x64.zip" -d "container/${{ matrix.component }}-amd64"
          unzip "artifacts/cfspeedtest-${{ matrix.component }}-linux-musl-arm64.zip" -d "container/${{ matrix.component }}-arm64"
          chmod +x "container/${{ matrix.component }}-amd64/CfSpeedtest.${{ matrix.component == 'server' && 'Server' || 'Client' }}"
          chmod +x "container/${{ matrix.component }}-arm64/CfSpeedtest.${{ matrix.component == 'server' && 'Server' || 'Client' }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/greepar/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-native
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-native

  create-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - build-web
      - build-native
      - publish-containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "!*.dockerbuild"
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            src/CfSpeedtest.Server/InstallScripts/install-cfspeedtest-client-linux.sh
            src/CfSpeedtest.Server/InstallScripts/install-cfspeedtest-client-macos.sh
            src/CfSpeedtest.Server/InstallScripts/install-cfspeedtest-client-windows.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
